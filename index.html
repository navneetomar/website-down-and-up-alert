<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eLibrary Sansad Status</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #4ade80;
      --red: #f87171;
      --blue: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 32px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { color: var(--muted); margin-bottom: 20px; }
    .sub a { color: var(--blue); text-decoration: none; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .card { background: var(--panel); border-radius: 12px; padding: 16px 18px; }
    .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .count { font-size: 40px; font-weight: 700; line-height: 1.1; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .bars { display: flex; gap: 3px; align-items: flex-end; height: 56px; margin-bottom: 8px; }
    .bar { flex: 1; min-width: 2px; height: 100%; border-radius: 2px; background: var(--green); }
    .bar.off { background: var(--red); }
    .legend { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 10px; }
    td { padding: 8px 10px; border-top: 1px solid #334155; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
    @media (max-width: 800px) {
      .cards { grid-template-columns: 1fr; }
      .wrap { padding: 16px 14px 24px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>eLibrary Sansad Status</h1>
    <div class="sub"><a id="siteLink" href="#" target="_blank" rel="noreferrer"></a> · checked every 5 minutes by GitHub Actions</div>
    <div class="cards">
      <div class="card">
        <div class="label">Current status</div>
        <div class="count" id="current">—</div>
      </div>
      <div class="card">
        <div class="label">Uptime (last <span id="window">0</span> checks)</div>
        <div class="count" id="uptime">—</div>
      </div>
      <div class="card">
        <div class="label">Last checked</div>
        <div id="checked">—</div>
        <div class="label mono" id="detail" style="margin-top:6px"></div>
      </div>
    </div>
    <div class="label">Recent checks</div>
    <div class="bars" id="bars"></div>
    <div class="legend"><span id="oldest"></span><span id="newest"></span></div>
    <div class="label" style="margin:22px 0 4px">Status changes</div>
    <table>
      <thead><tr><th>When</th><th>Status</th><th>Detail</th></tr></thead>
      <tbody id="events"><tr><td colspan="3">No changes recorded yet.</td></tr></tbody>
    </table>
    <div class="label" style="margin-top:18px">Refreshed <span id="refreshed">just now</span> · updates automatically every minute</div>
  </div>
  <script id="data" type="application/json">{"site_url": "https://elibrary.sansad.in", "up": true, "detail": "HTTP 200", "checked_at": "2026-09-19T13:28:33+00:00", "checks": 18, "history": [{"at": "2026-09-17T09:09:26+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-17T09:11:58+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-17T09:19:35+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-17T14:15:15+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-17T18:16:34+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-17T21:26:49+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-17T23:36:17+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-18T01:26:10+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-18T06:13:49+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-18T11:16:40+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-18T15:01:25+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-18T18:17:27+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-18T20:59:29+00:00", "up": false, "detail": "The read operation timed out"}, {"at": "2026-09-18T23:03:37+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-19T01:07:13+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-19T05:47:51+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-19T09:44:55+00:00", "up": true, "detail": "HTTP 200"}, {"at": "2026-09-19T13:28:33+00:00", "up": true, "detail": "HTTP 200"}]}</script>
  <script>
    const fmt = iso => new Date(iso).toLocaleString();
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function render(data) {
      const history = data.history || [];

      const link = document.getElementById('siteLink');
      link.href = data.site_url;
      link.textContent = (data.site_url || '').replace(/^https?:\/\//, '');

      const current = document.getElementById('current');
      if (data.up === true) { current.textContent = 'UP'; current.className = 'count up'; }
      else if (data.up === false) { current.textContent = 'DOWN'; current.className = 'count down'; }

      document.getElementById('window').textContent = history.length;
      if (history.length) {
        const ups = history.filter(h => h.up).length;
        document.getElementById('uptime').textContent = (ups / history.length * 100).toFixed(1) + '%';
        document.getElementById('oldest').textContent = fmt(history[0].at);
        document.getElementById('newest').textContent = fmt(history[history.length - 1].at);
      }
      if (data.checked_at) document.getElementById('checked').textContent = fmt(data.checked_at);
      document.getElementById('detail').textContent = data.detail || '';

      const bars = document.getElementById('bars');
      bars.innerHTML = '';
      history.forEach(h => {
        const bar = document.createElement('div');
        bar.className = 'bar' + (h.up ? '' : ' off');
        bar.title = fmt(h.at) + ' — ' + (h.up ? 'UP' : 'DOWN') + ' (' + h.detail + ')';
        bars.appendChild(bar);
      });

      const changes = history.filter((h, i) => i > 0 && h.up !== history[i - 1].up).reverse();
      document.getElementById('events').innerHTML = changes.length
        ? changes.map(h =>
            '<tr><td>' + esc(fmt(h.at)) + '</td><td class="' + (h.up ? 'up' : 'down') + '">' +
            (h.up ? 'Recovered' : 'Went down') + '</td><td class="mono">' + esc(h.detail) + '</td></tr>'
          ).join('')
        : '<tr><td colspan="3">No changes recorded yet.</td></tr>';

      document.getElementById('refreshed').textContent = new Date().toLocaleTimeString();
    }

    render(JSON.parse(document.getElementById('data').textContent));

    // The Pages CDN caches for 10 minutes, so bust it with a unique query per poll.
    async function poll() {
      try {
        const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) render(await res.json());
      } catch (err) {
        /* keep the last good data on screen */
      }
    }
    setInterval(poll, 60000);
  </script>
</body>
</html>
